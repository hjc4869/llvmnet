%ifndef %{llvmnet_dir}
%  error Define llvmnet_dir as the installed llvmnet toolchain prefix.
%endif
%ifndef %{llvmnet_runtime}
%  define llvmnet_runtime system
%endif
%ifndef %{build_ncpus}
%  define build_ncpus 4
%endif
%ifndef %{llvmnet_opt_level}
%  define llvmnet_opt_level 3
%endif
%ifndef %{llvmnet_vectorize}
%  define llvmnet_vectorize 0
%endif
%ifndef %{llvmnet_cxx_standard}
%  define llvmnet_cxx_standard 14
%endif
%ifndef %{llvmnet_threads}
%  define llvmnet_threads 1
%endif
%ifndef %{llvmnet_suite}
%  define llvmnet_suite 2017
%endif

label = llvmnet_%{llvmnet_runtime}_O%{llvmnet_opt_level}_v%{llvmnet_vectorize}_c%{llvmnet_cxx_standard}_t%{llvmnet_threads}
tune = base
copies = 1
threads = %{llvmnet_threads}
iterations = 1
reportable = 0
ignore_errors = 0
makeflags = --jobs=%{build_ncpus}
output_format = txt,cfg,csv
command_add_redirect = 1
flagsurl = $[top]/config/flags/llvmnet.xml

default:
CC = %{llvmnet_dir}/bin/llvmnet-clang
CXX = %{llvmnet_dir}/bin/llvmnet-clang++
FC = %{llvmnet_dir}/bin/llvmnet-flang
CC_VERSION_OPTION = --version
CXX_VERSION_OPTION = --version
FC_VERSION_OPTION = --version
OPTIMIZE = -O%{llvmnet_opt_level}
%if %{llvmnet_vectorize}
EXTRA_OPTIMIZE = -fvectorize -fslp-vectorize
%endif
CXXPORTABILITY = -std=gnu++%{llvmnet_cxx_standard}
EXTRA_CFLAGS = --runtime=%{llvmnet_runtime}
EXTRA_CXXFLAGS = --runtime=%{llvmnet_runtime}
EXTRA_FFLAGS = --runtime=%{llvmnet_runtime}
EXTRA_LDFLAGS = --runtime=%{llvmnet_runtime} --nativeaot
%ifdef %{llvmnet_system_cxx}
EXTRA_CXXLIBS = %{llvmnet_system_cxx}
%endif
EXTRA_PORTABILITY = -DSPEC_LP64
sw_base_ptrsize = 64-bit
sw_peak_ptrsize = 64-bit
sw_compiler = llvmnet 0.3.0-dev, Clang/Flang 22, .NET 10 NativeAOT
notes_comp_000 = LLVM bitcode is translated to CIL and compiled with NativeAOT.
notes_comp_010 = The system mode uses the Linux x86-64 ABI and system C libraries.
notes_comp_020 = The portable mode uses the versioned dotnet64-v2 sysroot: musl, libc++ and flang-rt compiled to CIL.
notes_comp_030 = NativeAOT embeds generated ABI shims; executables do not require a dotnet command.
notes_submit_000 = This development configuration defaults to one copy and non-reportable operation.
notes_submit_010 = Full-suite validation, complete flag disclosure, system description, and SPEC rules are required for reportable results.

%if %{llvmnet_threads} > 1
openmp=base:
EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP
%if %{llvmnet_vectorize}
EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP -fvectorize -fslp-vectorize
%endif
%ifdef %{llvmnet_openmp_library}
EXTRA_LDFLAGS = --runtime=%{llvmnet_runtime} --nativeaot --system-library %{llvmnet_openmp_library}
%endif
%ifdef %{llvmnet_openmp_include}
EXTRA_PORTABILITY = -DSPEC_LP64 -I%{llvmnet_openmp_include}
%endif
%if %{llvmnet_suite} == 2026
doconcurrent=base:
EXTRA_FOPTIMIZE = -fopenmp -fdo-concurrent-to-openmp=host
%ifdef %{llvmnet_openmp_library}
EXTRA_LDFLAGS = --runtime=%{llvmnet_runtime} --nativeaot --system-library %{llvmnet_openmp_library}
%endif
%ifdef %{llvmnet_openmp_include}
EXTRA_PORTABILITY = -DSPEC_LP64 -I%{llvmnet_openmp_include}
%endif
%endif
%endif

%if %{llvmnet_suite} == 2017
500.perlbench_r,600.perlbench_s=base:
CPORTABILITY = -DSPEC_LINUX_X64
%if '%{llvmnet_runtime}' eq 'portable'
# musl's FILE is opaque and its sys/file.h does not include fcntl.h; perl has switches for both.
CPORTABILITY = -DSPEC_LINUX_X64 -DSPEC_NO_USE_STDIO_PTR -DSPEC_NO_USE_STDIO_BASE -DI_FCNTL
%endif

502.gcc_r,602.gcc_s=base:
EXTRA_COPTIMIZE = -fgnu89-inline

510.parest_r=base:
CXXPORTABILITY = -std=gnu++03

521.wrf_r,621.wrf_s=base:
CPORTABILITY = -DSPEC_CASE_FLAG
FPORTABILITY = -fconvert=big-endian
EXTRA_LDFLAGS = --runtime=%{llvmnet_runtime} --nativeaot --trap-missing-arguments
%if '%{llvmnet_runtime}' eq 'system'
%ifdef %{llvmnet_openmp_library}
EXTRA_LDFLAGS = --runtime=%{llvmnet_runtime} --nativeaot --trap-missing-arguments --system-library %{llvmnet_openmp_library}
%endif
%endif

523.xalancbmk_r,623.xalancbmk_s=base:
PORTABILITY = -DSPEC_LINUX
%if '%{llvmnet_runtime}' eq 'portable'
# Xerces finds its platform by __linux__, which portable code does not see (ADR-14); its Linux platform file
# includes linux/limits.h for PATH_MAX, which config/spec/include provides from <limits.h>.
PORTABILITY = -DSPEC_LINUX -D__linux__ -idirafter %{llvmnet_spec_include}
%endif
EXTRA_CXXOPTIMIZE = -fdelayed-template-parsing

525.x264_r,625.x264_s=base:
EXTRA_COPTIMIZE = -fcommon
%if '%{llvmnet_runtime}' eq 'portable'
CPORTABILITY = -include string.h -include stdlib.h
%endif

526.blender_r=base:
PORTABILITY = -funsigned-char
%if '%{llvmnet_runtime}' eq 'portable'
# libc++'s math.h, unlike libstdc++'s, does not declare std::isfinite; blender's documented switch calls finite().
PORTABILITY = -funsigned-char -DSPEC_NO_ISFINITE
%endif

527.cam4_r,627.cam4_s=base:
CPORTABILITY = -std=gnu89 -DSPEC_CASE_FLAG
FPORTABILITY = -Inetcdf

628.pop2_s=base:
CPORTABILITY = -DSPEC_CASE_FLAG
FPORTABILITY = -Inetcdf -fconvert=big-endian
%endif

%if %{llvmnet_suite} == 2026
%if '%{llvmnet_runtime}' eq 'portable'
# musl has no swapcontext; the model creates no activity() coroutines, so omnetpp's setjmp-based ones need only link.
710.omnetpp_r=base:
CXXPORTABILITY = -std=gnu++%{llvmnet_cxx_standard} -DUSE_PORTABLE_COROUTINES

# CPython's pthread stubs need the pthread types first, which glibc's stdlib.h declares through sys/types.h.
714.cpython_r=base:
CPORTABILITY = -include sys/types.h

# zstd detects POSIX through __unix__, which portable code does not see; it documents this override.
777.zstd_r=base:
CPORTABILITY = -DPLATFORM_POSIX_VERSION=200809L

# These select their platform code by __linux__ or __unix__, which portable code does not see (ADR-14): LLVM's
# SwapByteOrder.h and Unix paths, gem5's libelf (roundup2, byte order) and marian's path library. LLVM's prebuilt
# config.h also includes glibc's execinfo.h, which config/spec/include declares, and gem5 uses mode_t where only
# glibc's headers have declared it.
723.llvm_r,823.llvm_s=base:
PORTABILITY = -D__linux__ -idirafter %{llvmnet_spec_include}

735.gem5_r,835.gem5_s=base:
PORTABILITY = -D__linux__ -include sys/types.h

772.marian_r,872.marian_s=base:
PORTABILITY = -D__linux__ -D__unix__
%endif

735.gem5_r,835.gem5_s=base:
EXTRA_CXXOPTIMIZE = -Ulinux
%endif