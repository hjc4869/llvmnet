name: ci

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  pr-gate:
    name: PR gate (Linux x64)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Not hashFiles(): actions/cache re-evaluates its key in the post step, on the host as the runner user, and by
      # then the tests have left root-owned mktemp -d (0700) directories in the workspace that its walk cannot enter.
      - name: Hash the dependency inputs
        id: deps
        shell: bash
        run: echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      - name: Build
        run: bash scripts/ensure-built.sh
      - name: Format check
        run: dotnet format whitespace llvmnet.slnx --verify-no-changes
      - name: Unit tests
        run: dotnet test tests/LlvmNet.UnitTests -c Release --no-build --logger "trx;LogFileName=unit-results.trx" --results-directory artifacts/tests/unit
      - name: Shell lint
        run: shellcheck -S error scripts/*.sh scripts/ci/*.sh tests/*.sh tests/xp/*.sh bin/llvmnet bin/llvmnet-tool
      - name: Core and toolchain tests
        run: tests/run.sh --no-build --tag core --tag toolchain --exclude-tag slow -j 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-results
          path: |
            artifacts/tests/results
            artifacts/tests/unit
          if-no-files-found: ignore
      # The cross-platform bundle tests/xp.sh built: portable images with their native results, run by the xp jobs.
      - uses: actions/upload-artifact@v4
        with:
          name: xp-bundle
          path: artifacts/tests/xp/bundle.tar.gz

  nightly:
    name: Nightly integration (Linux x64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 360
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh --integration
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Not hashFiles(): actions/cache re-evaluates its key in the post step, on the host as the runner user, and by
      # then the tests have left root-owned mktemp -d (0700) directories in the workspace that its walk cannot enter.
      - name: Hash the dependency inputs
        id: deps
        shell: bash
        run: echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      - name: Fetch pinned sources
        run: scripts/fetch-sources.sh
      - name: Build
        run: bash scripts/ensure-built.sh
      - name: Unit tests
        run: dotnet test tests/LlvmNet.UnitTests -c Release --no-build
      # Each tests/run.sh call starts a fresh artifacts/tests/results, so every step keeps a copy of its own.
      - name: All tags
        run: |
          tests/run.sh --no-build --tag core --tag toolchain --tag integration --tag optional -j 4 --timeout-scale 2
          cp -a artifacts/tests/results artifacts/tests/results-all
      - name: Differential fuzzing (FD-16)
        if: always()
        # 500 new seeds per generator every night, starting from a seed derived from the date.
        run: |
          export FUZZ_SEEDS=500 FUZZ_FIRST_SEED=$(( $(date -u +%s) / 86400 * 1000 ))
          tests/run.sh --no-build --tag fuzz --timeout-scale 2
          cp -a artifacts/tests/results artifacts/tests/results-fuzz
      # PF-01: the benchmark set against native builds, with the regression thresholds against tests/perf/baseline.tsv.
      # It runs last, alone, so the measurements are not disturbed; a confirmed regression fails the job. Three runs
      # per engine instead of five keep it near an hour on the runner; the thresholds judge each benchmark's fastest run.
      - name: Benchmarks (PF-01)
        if: always()
        run: python3 scripts/benchmark.py --repeats 3 --output artifacts/bench/nightly
      - uses: actions/upload-artifact@v4
        with:
          name: xp-bundle
          path: artifacts/tests/xp/bundle.tar.gz
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            artifacts/bench/nightly/results.tsv
            artifacts/bench/nightly/summary.md
            artifacts/bench/nightly/metadata.json
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: |
            artifacts/tests/results-*
            artifacts/tests/fuzz
          if-no-files-found: ignore

  # WG-01 to WG-03 (docs/dev/gates.md): the upstream conformance suites, in their own job so the nightly integration
  # job stays within its time limit. Each suite fails below its threshold; the thresholds are the gate's, set here.
  conformance:
    name: Nightly conformance (Linux x64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 360
    env:
      LIBC_THRESHOLD: "88"
      LIBCXX_THRESHOLD: "97"
      FORTRAN_THRESHOLD: "99"
      C_TESTSUITE_THRESHOLD: "99"
      LLVM_TEST_SUITE_THRESHOLD: "98"
      LLVM_TEST_SUITE_JOBS: "4"
      FLANG_RT_UNITTESTS_THRESHOLD: "100"
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh --integration
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Hash the dependency inputs
        id: deps
        shell: bash
        run: echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      - name: Fetch pinned sources
        run: scripts/fetch-sources.sh musl llvm-project llvm-test-suite libc-test c-testsuite
      - name: Build
        run: bash scripts/ensure-built.sh
      # libc-test (LC-19), libc++ (CX-08), FCVS and the gfortran tests (FT-06), flang-rt's unit tests, c-testsuite and
      # llvm-test-suite with gcc-c-torture (WG-01, WG-02) in portable, system and portable NativeAOT modes.
      - name: Conformance suites
        run: |
          tests/run.sh --no-build --tag conformance --timeout-scale 2
          cp -a artifacts/tests/results artifacts/tests/results-conformance
      - name: libc++ under NativeAOT (CX-08 subset)
        if: always()
        run: |
          LIBCXX_NATIVEAOT=1 LIBCXX_LIT_JOBS=2 bash tests/libcxx-conformance.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            artifacts/tests/results-conformance
            artifacts/tests/*-conformance*/summary.tsv
            artifacts/tests/*-conformance*/failures.txt
            artifacts/tests/libc-conformance/results.tsv
            artifacts/tests/fortran-conformance/results.tsv
            artifacts/tests/c-testsuite/*.tsv
            artifacts/tests/c-testsuite/failures.txt
            artifacts/tests/llvm-test-suite/*.tsv
            artifacts/tests/llvm-test-suite/failures.txt
            artifacts/tests/flang-rt-unittests/*.tsv
            artifacts/tests/flang-rt-unittests/failures.txt
          if-no-files-found: ignore

  # WG-04: ffmpeg's FATE suite against the real ffmpeg and ffprobe programs, native and portable builds of the same
  # configuration, with the FATE samples verified against tests/ffmpeg/fate-suite.sha256 and cached between runs.
  fate:
    name: Nightly FATE (Linux x64)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 360
    env:
      FFMPEG_FATE_THRESHOLD: "99"
      FFMPEG_FATE_JOBS: "4"
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh --integration
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Hash the dependency inputs
        id: deps
        shell: bash
        run: echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      - uses: actions/cache@v4
        with:
          path: artifacts/vendor/fate-suite
          key: fate-suite-${{ hashFiles('tests/ffmpeg/fate-suite.sha256') }}
      - name: Build
        run: bash scripts/ensure-built.sh
      - name: FATE
        run: tests/run.sh --no-build --tag fate --timeout-scale 2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fate-results
          path: |
            artifacts/tests/results
            artifacts/tests/ffmpeg-fate/*.tsv
            artifacts/tests/ffmpeg-fate/failures.txt
          if-no-files-found: ignore

  # XP-01 to XP-03: the same portable images the Linux job built and checked against native output run under the JIT
  # and, published from their relocatable NativeAOT projects, as native executables on each other supported host.
  xp:
    name: Portable images on ${{ matrix.name }}
    needs: [pr-gate, nightly]
    if: ${{ !cancelled() && (needs.pr-gate.result == 'success' || needs.nightly.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-2025 }
          - { name: macOS ARM64, os: macos-15 }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: xp-bundle
      - name: Install the NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Run the bundle under the JIT and as NativeAOT executables
        shell: bash
        run: |
          tar xzf bundle.tar.gz
          bash bundle/run.sh --aot --jobs 2 bundle
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-results-${{ matrix.os }}
          path: |
            bundle/results/*/results.tsv
            bundle/results/*/host.txt
            bundle/results/*/*-jit/stdout.diff
            bundle/results/*/*-aot/stdout.diff
            bundle/results/*/*-publish/publish.log
          if-no-files-found: ignore
