# Release artifacts from a tag (TC-11, XP-04): the thin and bundled-LLVM Linux toolchain packages as reproducible tar.xz
# files, the dotnet tool package, the portable toolchain (.tar.xz and .zip: the compiler on LLVM built by llvmnet and the
# llvmnet-built clang, flang, opt and llvm-ar, for every .NET 10 host) and the same precompiled for each supported host,
# SHA256SUMS, and a Sigstore signature of each file made with the workflow's own identity (cosign keyless signing through
# GitHub's OIDC token: no key to keep).
#
# The workflow only builds and packages: the gate (ci.yml) tests the commit, and tests/portable-toolchain/ checks a
# portable toolchain on a host by hand (docs/dev/release-process.md). The portable job builds LLVM, Clang, MLIR and Flang
# with llvmnet (scripts/selfhost/): about 5,300 objects, hours on a 4-core runner when the cache is cold. Its build tree is
# cached (restored from the newest entry and saved even when the job times out, so a cold build completes over reruns),
# and the repository variable LLVMNET_PORTABLE_RUNNER can name a larger runner. Each host's precompiled package is made
# from the universal one in a job of its own, in parallel.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      portable:
        description: Build the portable toolchain (LLVM built with llvmnet)
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  artifacts:
    name: Linux x64 packages and the dotnet tool
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Hash the dependency and sysroot inputs
        id: deps
        shell: bash
        run: |
          echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "sysroot=$(git ls-files -z ports scripts/build-sysroot.sh 'scripts/build-portable-*.sh' scripts/build-flang-rt.sh \
            src/LlvmNet.Compiler/Driver.cs src/LlvmNet.Compiler/PortableAbi.cs src/LlvmNet.Compiler/Llvm.cs native/abi.cpp scripts/sources.lock |
            xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      # build-sysroot.sh checks its own input hash in the restored sysroot and rebuilds it when it differs.
      - uses: actions/cache@v4
        with:
          path: |
            sysroot/dotnet64-v2
            sysroot/system-linux-x64-v1
          key: sysroot-${{ runner.os }}-${{ steps.deps.outputs.sysroot }}
      - name: Build the compiler and the sysroots
        run: bash scripts/ensure-built.sh
      - name: Package
        run: bash scripts/release-artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.tar.xz
            dist/*.nupkg

  portable:
    name: Portable toolchain (LLVM built with llvmnet)
    if: github.event_name == 'push' || inputs.portable
    runs-on: ${{ vars.LLVMNET_PORTABLE_RUNNER || 'ubuntu-24.04' }}
    container: debian:trixie
    timeout-minutes: 360
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh --selfhost
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Hash the dependency, sysroot and LLVM build inputs
        id: deps
        shell: bash
        run: |
          echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "sysroot=$(git ls-files -z ports scripts/build-sysroot.sh 'scripts/build-portable-*.sh' scripts/build-flang-rt.sh \
            src/LlvmNet.Compiler/Driver.cs src/LlvmNet.Compiler/PortableAbi.cs src/LlvmNet.Compiler/Llvm.cs native/abi.cpp scripts/sources.lock |
            xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "selfhost=$(git ls-files -z scripts/sources.lock scripts/selfhost | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      - uses: actions/cache@v4
        with:
          path: |
            sysroot/dotnet64-v2
            sysroot/system-linux-x64-v1
          key: sysroot-${{ runner.os }}-${{ steps.deps.outputs.sysroot }}
      # The patched source copy and the build tree: ninja rebuilds what the sysroot headers or the flags changed, which
      # after a compiler-only change is nothing; the tools and the library are relinked every time.
      - name: Restore the LLVM build tree
        id: selfhost-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/selfhost-build/llvm-project
            artifacts/selfhost-build/llvm
          key: selfhost-${{ steps.deps.outputs.selfhost }}-${{ github.sha }}
          restore-keys: |
            selfhost-${{ steps.deps.outputs.selfhost }}-
            selfhost-
      - name: Build the compiler and the sysroots
        run: bash scripts/ensure-built.sh
      - name: Fetch LLVM's sources
        run: scripts/fetch-sources.sh llvm-project
      - name: Configure LLVM for portable mode
        run: bash scripts/selfhost/configure.sh
      - name: Build LlvmNet.Llvm.dll (the compiler's LLVM)
        run: bash scripts/selfhost/build-library.sh
      - name: Build clang, flang, opt, llvm-ar and llvm-nm
        run: bash scripts/selfhost/build-tools.sh
      - name: Save the LLVM build tree
        if: always() && steps.selfhost-cache.outputs.cache-matched-key != format('selfhost-{0}-{1}', steps.deps.outputs.selfhost, github.sha)
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/selfhost-build/llvm-project
            artifacts/selfhost-build/llvm
          key: selfhost-${{ steps.deps.outputs.selfhost }}-${{ github.sha }}
      - name: Package the universal portable toolchain
        run: LLVMNET_RELEASE_VARIANTS=portable bash scripts/release-artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: portable-universal
          compression-level: 0
          path: |
            dist/*.tar.xz
            dist/*.zip

  portable-precompiled:
    name: Portable toolchain precompiled for ${{ matrix.rid }}
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # crossgen2 and the target's runtime pack come from NuGet through the SDK; no build of the checkout is needed.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: portable-universal
          path: universal-archive
      - name: Precompile and package
        run: |
          mkdir -p universal
          tar -xJf universal-archive/llvmnet-*-portable.tar.xz -C universal
          LLVMNET_PORTABLE_UNIVERSAL="$(echo "$PWD"/universal/llvmnet-*-portable)" LLVMNET_RELEASE_VARIANTS="portable-${{ matrix.rid }}" \
            JOBS=2 bash scripts/release-artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.rid }}
          compression-level: 0
          path: |
            dist/*.tar.xz
            dist/*.zip

  publish:
    name: Sign and publish
    needs: [artifacts, portable, portable-precompiled]
    if: ${{ !cancelled() && needs.artifacts.result == 'success' && (needs.portable.result == 'skipped' || needs.portable-precompiled.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.portable.result == 'success'
        with:
          pattern: portable-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && shopt -s nullglob && sha256sum -- *.tar.xz *.zip *.nupkg >SHA256SUMS && cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign every artifact (Sigstore bundle next to each file)
        run: |
          cd dist
          shopt -s nullglob
          for file in *.tar.xz *.zip *.nupkg SHA256SUMS; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Verify the signatures
        run: |
          cd dist
          shopt -s nullglob
          for file in *.tar.xz *.zip *.nupkg SHA256SUMS; do
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          compression-level: 0
          path: dist
      - name: Create the GitHub release with the artifacts attached
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" --title "llvmnet $version" --notes-file <(awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md) \
            dist/*.tar.xz dist/*.zip dist/*.nupkg dist/SHA256SUMS dist/*.sigstore.json
