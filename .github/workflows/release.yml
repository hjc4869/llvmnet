# Release from a tag or a manual run (TC-11, XP-04): the thin and bundled-LLVM Linux toolchain packages as reproducible
# tar.xz files, the dotnet tool package, the portable toolchain (.tar.xz and .zip: the compiler on LLVM built by llvmnet
# and the llvmnet-built clang, flang, opt and llvm-ar, for every .NET 10 host), the same precompiled for each supported
# host, and SHA256SUMS, each attached to a GitHub release as a file of its own. A v* tag gets the release of that tag with
# its CHANGELOG section; a manual run gets a prerelease v<version>.<run number> at the commit it built.
#
# The workflow only builds and packages: the gate (ci.yml) tests the commit, and tests/portable-toolchain/ checks a
# portable toolchain on a host by hand (docs/dev/release-process.md). The portable job builds LLVM, Clang, MLIR and Flang
# with llvmnet (scripts/selfhost/): about 5,300 objects, hours on a 4-core runner when the cache is cold. A bootstrap
# build by default (XP-11): the release pinned as llvmnet-bootstrap in scripts/sources.lock, its linux-x64 package with
# NativeAOT tools, compiles LLVM, and this commit's compiler links the library and the tools, so no LLVM of the runner's
# is used for them; a manual run can choose the checkout's compiler on Debian's LLVM 22 instead (llvm: native). Its
# build tree is cached (restored from the newest entry and saved even when the job times out, so a cold build completes
# over reruns), and the repository variable LLVMNET_PORTABLE_RUNNER can name a larger runner. Each host's precompiled
# package has the LLVM tools as NativeAOT executables (XP-14), which NativeAOT can only compile on a host of the same
# operating system: the portable job links the tools a second time, for NativeAOT (XP-16: an executable published from a
# JIT image takes about 1.15 times as long to compile), and uploads their projects, a runner of each host publishes them
# (aot-tools), and a Linux job per host makes the package from the universal one with them, precompiling the compiler
# with ReadyToRun. The jobs hand their files on as short-lived workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      portable:
        description: Build the portable toolchain (LLVM built with llvmnet)
        type: boolean
        default: true
      llvm:
        description: "What compiles LLVM for the portable toolchain: the release pinned as llvmnet-bootstrap, or this commit's compiler on Debian's LLVM 22"
        type: choice
        options: [bootstrap, native]
        default: bootstrap

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  artifacts:
    name: Linux x64 packages and the dotnet tool
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Hash the dependency and sysroot inputs
        id: deps
        shell: bash
        run: |
          echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "sysroot=$(git ls-files -z ports scripts/build-sysroot.sh 'scripts/build-portable-*.sh' scripts/build-flang-rt.sh \
            src/LlvmNet.Compiler/Driver.cs src/LlvmNet.Compiler/PortableAbi.cs src/LlvmNet.Compiler/Llvm.cs native/abi.cpp scripts/sources.lock |
            xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      # build-sysroot.sh checks its own input hash in the restored sysroot and rebuilds it when it differs.
      - uses: actions/cache@v4
        with:
          path: |
            sysroot/dotnet64-v2
            sysroot/system-linux-x64-v1
          key: sysroot-${{ runner.os }}-${{ steps.deps.outputs.sysroot }}
      - name: Build the compiler and the sysroots
        run: bash scripts/ensure-built.sh
      - name: Package
        run: bash scripts/release-artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          retention-days: 1
          path: |
            dist/*.tar.xz
            dist/*.nupkg
            dist/VERSION

  portable:
    name: Portable toolchain (LLVM built with llvmnet)
    if: github.event_name == 'push' || inputs.portable
    runs-on: ${{ vars.LLVMNET_PORTABLE_RUNNER || 'ubuntu-24.04' }}
    container: debian:trixie
    timeout-minutes: 360
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install packages
        run: bash scripts/ci/install-packages.sh --selfhost
      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Hash the dependency, sysroot and LLVM build inputs
        id: deps
        shell: bash
        run: |
          echo "hash=$(git ls-files -z '*.csproj' Directory.Build.props scripts/sources.lock | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "sysroot=$(git ls-files -z ports scripts/build-sysroot.sh 'scripts/build-portable-*.sh' scripts/build-flang-rt.sh \
            src/LlvmNet.Compiler/Driver.cs src/LlvmNet.Compiler/PortableAbi.cs src/LlvmNet.Compiler/Llvm.cs native/abi.cpp scripts/sources.lock |
            xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "selfhost=$(git ls-files -z scripts/sources.lock scripts/selfhost | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "llvm=${{ inputs.llvm || 'bootstrap' }}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            artifacts/vendor/downloads
            artifacts/vendor/musl-native
          key: deps-${{ runner.os }}-${{ steps.deps.outputs.hash }}
      - uses: actions/cache@v4
        with:
          path: |
            sysroot/dotnet64-v2
            sysroot/system-linux-x64-v1
          key: sysroot-${{ runner.os }}-${{ steps.deps.outputs.sysroot }}
      # The patched source copy and the build tree, one per way of building it: ninja rebuilds what the sysroot headers or
      # the flags changed, which after a compiler-only change is nothing; the tools and the library are relinked every time.
      # A bootstrap build also keeps the prepared toolchain that compiles LLVM, which bootstrap.sh remakes when the pin changes.
      - name: Restore the LLVM build tree
        id: selfhost-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/selfhost-build/llvm-project
            artifacts/selfhost-build/llvm
            artifacts/selfhost-build/bootstrap
          key: selfhost-${{ steps.deps.outputs.llvm }}-${{ steps.deps.outputs.selfhost }}-${{ github.sha }}
          restore-keys: |
            selfhost-${{ steps.deps.outputs.llvm }}-${{ steps.deps.outputs.selfhost }}-
            selfhost-${{ steps.deps.outputs.llvm }}-
      - name: Build the compiler and the sysroots
        run: bash scripts/ensure-built.sh
      - name: Fetch LLVM's sources
        run: scripts/fetch-sources.sh llvm-project
      # The scripts take the toolchain that compiles LLVM from LLVMNET_SELFHOST_TOOLCHAIN (scripts/selfhost/common.sh):
      # the pinned release's package precompiled for linux-x64, used as it is: its LLVM tools are NativeAOT executables
      # and its compiler is precompiled with ReadyToRun, where the universal package's run under the JIT.
      - name: Prepare the release that compiles LLVM (llvmnet-bootstrap in scripts/sources.lock)
        if: steps.deps.outputs.llvm == 'bootstrap'
        run: echo "LLVMNET_SELFHOST_TOOLCHAIN=$(bash scripts/selfhost/bootstrap.sh)" >>"$GITHUB_ENV"
      - name: Configure LLVM for portable mode
        run: bash scripts/selfhost/configure.sh
      - name: Build LlvmNet.Llvm.dll (the compiler's LLVM)
        run: bash scripts/selfhost/build-library.sh
      - name: Build clang, flang, opt, llvm-ar and llvm-nm
        run: bash scripts/selfhost/build-tools.sh
      - name: Save the LLVM build tree
        if: always() && steps.selfhost-cache.outputs.cache-matched-key != format('selfhost-{0}-{1}-{2}', steps.deps.outputs.llvm, steps.deps.outputs.selfhost, github.sha)
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/selfhost-build/llvm-project
            artifacts/selfhost-build/llvm
            artifacts/selfhost-build/bootstrap
          key: selfhost-${{ steps.deps.outputs.llvm }}-${{ steps.deps.outputs.selfhost }}-${{ github.sha }}
      # The same objects and the same compiler as the JIT images above, translated for NativeAOT: no type initializer
      # to test before a global is read, no fat-pointer test at indirect calls, frame slots for stack allocations.
      - name: Link the LLVM tools for NativeAOT
        run: bash scripts/selfhost/build-aot-projects.sh aot-projects
      - name: Package the universal portable toolchain
        run: LLVMNET_RELEASE_VARIANTS=portable bash scripts/release-artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: portable-universal
          retention-days: 1
          compression-level: 0
          path: |
            dist/*.tar.xz
            dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: aot-projects
          retention-days: 1
          path: aot-projects

  aot-tools:
    name: LLVM tools as NativeAOT executables for ${{ matrix.rid }}
    needs: portable
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-2025 }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # NativeAOT links with the host's C toolchain: clang and zlib on Linux, MSVC on Windows and Xcode on macOS, which the
      # Windows and macOS images have.
      - name: Install clang and zlib
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - uses: actions/download-artifact@v4
        with:
          name: aot-projects
          path: aot-projects
      - name: Publish the tools
        shell: bash
        run: bash scripts/aot-tools.sh publish aot-projects ${{ matrix.rid }} aot-tools
      - uses: actions/upload-artifact@v4
        with:
          name: aot-tools-${{ matrix.rid }}
          retention-days: 1
          path: aot-tools

  portable-precompiled:
    name: Portable toolchain precompiled for ${{ matrix.rid }}
    needs: [portable, aot-tools]
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64, osx-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # crossgen2 and the target's runtime pack come from NuGet through the SDK; no build of the checkout is needed.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: portable-universal
          path: universal-archive
      - uses: actions/download-artifact@v4
        with:
          name: aot-tools-${{ matrix.rid }}
          path: aot-tools
      - name: Precompile and package
        run: |
          mkdir -p universal
          tar -xJf universal-archive/llvmnet-*-portable.tar.xz -C universal
          LLVMNET_PORTABLE_UNIVERSAL="$(echo "$PWD"/universal/llvmnet-*-portable)" LLVMNET_RELEASE_VARIANTS="portable-${{ matrix.rid }}" \
            LLVMNET_AOT_TOOLS="$PWD/aot-tools" JOBS=2 bash scripts/release-artifacts.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.rid }}
          retention-days: 1
          compression-level: 0
          path: |
            dist/*.tar.xz
            dist/*.zip

  release:
    name: GitHub release
    needs: [artifacts, portable, aot-tools, portable-precompiled]
    if: ${{ !cancelled() && needs.artifacts.result == 'success' && (needs.portable.result == 'skipped' || needs.portable-precompiled.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        if: needs.portable.result == 'success'
        with:
          pattern: portable-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && shopt -s nullglob && sha256sum -- *.tar.xz *.zip *.nupkg >SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub release with every file attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          version="$(cat dist/VERSION)"
          files=(dist/*.tar.xz dist/*.zip dist/*.nupkg dist/SHA256SUMS)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md >notes.md
            notes=(--notes-file notes.md)
            [[ -s notes.md ]] || notes=(--generate-notes)
            gh release create "$GITHUB_REF_NAME" --title "llvmnet $version" "${notes[@]}" "${files[@]}"
          else
            tag="v${version%%+*}.${GITHUB_RUN_NUMBER}"
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "llvmnet $version (development build)" \
              --notes "Built from $GITHUB_SHA ($GITHUB_REF_NAME) by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; not tested by this workflow." \
              "${files[@]}"
          fi
