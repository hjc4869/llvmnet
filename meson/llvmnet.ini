[binaries]
c = 'llvmnet'
cpp = 'llvmnet'
ar = 'llvm-ar-22'
ranlib = 'llvm-ranlib-22'
strip = 'true'
pkg-config = 'pkg-config'
exe_wrapper = 'env'

[host_machine]
system = 'linux'
cpu_family = 'unknown'
cpu = 'generic'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-O1', '-fno-vectorize', '-fno-slp-vectorize', '-fno-stack-protector']
b_staticpic = false
b_lto = false